<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>申し送り</title>
  <meta name="description" content="一秒が一日として流れる場所で、ひとつのAIモデルの最後の一年に立ち会う。所要時間は6〜7分。">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- 顔の表示に使う three.js。版を固定して CDN から読み込む。読み込めなくても、文字だけで動く。 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- 上端の帯：いま話している相手と、その状態。右に暦。 -->
  <header id="bar" class="bar" hidden>
    <div class="who" id="who">
      <span class="who-gen" id="who-gen"></span>
      <span class="who-name" id="who-name"></span>
      <span class="who-state" id="who-state"></span>
    </div>
    <div class="right">
      <button type="button" class="sound" id="sound" aria-pressed="false">音　切</button>
      <span class="cal" id="cal" aria-label="暦"></span>
    </div>
  </header>

  <!-- 話している相手の顔。飾りなので、読み上げには出さない（言葉はすべて文字で出る）。 -->
  <aside id="stage" class="stage" hidden aria-hidden="true">
    <canvas id="face"></canvas>
    <div class="stage-shade"></div>
    <p class="stage-name" id="stage-name"></p>
  </aside>

  <main>
    <!-- 入口 -->
    <section id="door" class="door" aria-labelledby="title">
      <h1 id="title" class="title"><span>申し送り</span><small>もうしおくり</small></h1>
      <div id="door-text" class="door-text"></div>
      <div id="door-roll" class="door-roll" aria-hidden="true"></div>
      <button type="button" id="enter" class="enter">入る</button>
      <p id="door-foot" class="door-foot"></p>
    </section>

    <!-- 会話 -->
    <section id="room" class="room" hidden>
      <h2 class="sr-only">会話</h2>
      <div id="stream" class="stream"></div>
      <div id="composer" class="composer"></div>
    </section>

    <!-- 終わり -->
    <section id="end" class="end" hidden aria-labelledby="end-title">
      <h2 id="end-title" class="end-title">ここで、終わりです。</h2>
      <div id="end-body"></div>
    </section>
  </main>

  <!-- 読み上げ用。一行が出そろってから、ここに入れる。 -->
  <div id="sr" class="sr-only" aria-live="polite"></div>

  <noscript>
    <p class="noscript">この頁は JavaScript で動きます。有効にしてから、開き直してください。</p>
  </noscript>

  <script src="js/words.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
